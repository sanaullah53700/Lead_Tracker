      --source-ref-border: #DDD6FE;

    .modal-scrollable-body::-webkit-scrollbar,

    .modal-card { background: var(--bg-surface); border-radius: var(--radius-lg); border: 1px solid var(--border-color); width: 100%; max-width: 580px; box-shadow: var(--shadow-lg); overflow: hidden; max-height: 90vh; display: flex; flex-direction: column; }
    .modal-header { padding: 1.1rem 1.35rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: #FAFAFA; }
    .modal-body { padding: 1.25rem 1.35rem; display: flex; flex-direction: column; gap: 1.1rem; overflow-y: auto; }
    .form-group { display: flex; flex-direction: column; gap: 0.35rem; }
    .form-input, .form-select, .comment-textarea { padding: 0.6rem 0.8rem; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 0.875rem; width: 100%; }
    .modal-footer { padding: 0.9rem 1.35rem; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 0.65rem; background: #FAFAFA; }

    .timeline-comment-item { padding: 0.75rem; background: #FFF; border: 1px solid var(--border-color); border-left: 3px solid var(--primary); border-radius: var(--radius-md); display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 0.5rem; }

    @media (max-width: 768px) {

    }
  </style>

    function getInitials(name) {
      if (!name) return 'LD';
      const parts = name.trim().split(/\s+/);
      return parts.length === 1 ? parts[0].slice(0, 2).toUpperCase() : (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    function getAvatarColor(name) {
      const colors = [
        { bg: '#EFF6FF', text: '#1D4ED8', border: '#BFDBFE' },
        { bg: '#F0FDF4', text: '#15803D', border: '#BBF7D0' },
        { bg: '#FAF5FF', text: '#6B21A8', border: '#E9D5FF' }
      ];
      let hash = 0;
      for (let i = 0; i < (name || '').length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      return colors[Math.abs(hash) % colors.length];
    }

          const q = searchQuery.toLowerCase();
          const matchesCompany = (l.companyName||'').toLowerCase().includes(q);
          const matchesEmp = (l.employees||[]).some(e => (e.name||'').toLowerCase().includes(q) || (e.role||'').toLowerCase().includes(q) || (e.phone||'').includes(q) || (e.email||'').toLowerCase().includes(q));
          const matchesComments = (l.comments||[]).some(c => (c.text||'').toLowerCase().includes(q) || (c.employeeName||'').toLowerCase().includes(q));
          const matchesSearch = !q || matchesCompany || matchesEmp || matchesComments;
          const matchesSource = sourceFilter === 'All' || l.source === sourceFilter;
          const matchesStatus = statusFilter === 'All' || l.status === statusFilter;
          return matchesSearch && matchesSource && matchesStatus;
        });

        res.sort((a,b) => {
          let aVal = '', bVal = '';
          if (sortField === 'companyName') { aVal = a.companyName; bVal = b.companyName; }
          else if (sortField === 'role') { aVal = a.employees?.[0]?.role || ''; bVal = b.employees?.[0]?.role || ''; }
          else if (sortField === 'primaryName') { aVal = a.employees?.[0]?.name || ''; bVal = b.employees?.[0]?.name || ''; }
          else if (sortField === 'value') {
            aVal = parseFloat((a.value||'').replace(/[^0-9.]/g,'')) || 0;
            bVal = parseFloat((b.value||'').replace(/[^0-9.]/g,'')) || 0;
          } else {
            aVal = (a[sortField]||'').toString(); bVal = (b[sortField]||'').toString();
          }
          if (typeof aVal === 'string') { aVal = aVal.toLowerCase(); bVal = bVal.toLowerCase(); }
          if (aVal < bVal) return sortDirection === 'asc' ? -1 : 1;
          if (aVal > bVal) return sortDirection === 'asc' ? 1 : -1;
          return 0;
        });
        return res;
      }, [leads, searchQuery, sourceFilter, statusFilter, sortField, sortDirection]);

      const totalPipelineValue = React.useMemo(() => {
        const sum = leads.reduce((acc, l) => acc + (parseFloat((l.value||'').replace(/[^0-9.]/g, '')) || 0), 0);
        return `$${sum.toLocaleString()}`;
      }, [leads]);

      const handleSave = (formData) => {
        const initialComments = editLead ? (editLead.comments || []) : [];
        if (formData.initialComment) {
          const now = new Date();
          const timestamp = `${now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })} • ${now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}`;
          const targetEmp = formData.commentEmployee || formData.employees?.[0]?.name || 'Primary Contact';
          initialComments.unshift({ id: `c-${Date.now()}`, employeeName: targetEmp, text: formData.initialComment, timestamp });
        }

        if (editLead) {
          setLeads(prev => prev.map(l => l.id === editLead.id ? { ...l, ...formData, comments: initialComments } : l));
          showToast('Lead record updated');
        } else {
          const newLead = { id: `lead-${Date.now()}`, ...formData, comments: initialComments };
          setLeads(prev => [newLead, ...prev]);
          showToast(`Company "${newLead.companyName}" added successfully`);
        }
        setIsModalOpen(false);
      };

      const handleDelete = (id) => {
        if (confirm('Delete this lead record?')) {
          setLeads(prev => prev.filter(l => l.id !== id));
          showToast('Company record deleted');
        }
      };

      const handleAddComment = (leadId, text, employeeName) => {
        const now = new Date();
        const timestamp = `${now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })} • ${now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}`;
        const targetEmp = employeeName || 'Primary Contact';
        const newC = { id: `c-${Date.now()}`, employeeName: targetEmp, text: text.trim(), timestamp };
        setLeads(prev => prev.map(l => l.id === leadId ? { ...l, comments: [newC, ...(l.comments||[])] } : l));
        showToast(`Note assigned to ${targetEmp}`);
      };

      const handleDeleteComment = (leadId, cId) => {
        setLeads(prev => prev.map(l => l.id === leadId ? { ...l, comments: (l.comments||[]).filter(c=>c.id!==cId) } : l));
        showToast('Comment deleted');
      };

      const exportCSV = () => {
        const headers = ['Company', 'Primary Role', 'Primary Contact', 'Phone', 'Email', 'Latest Employee Note', 'Source', 'Status', 'Deal Value'];
        const rows = filteredAndSorted.map(l => {
          const primary = l.employees?.[0] || {};
          const latestComment = l.comments?.[0] ? `${l.comments[0].employeeName}: ${l.comments[0].text}` : '';
          return [`"${l.companyName}"`, `"${primary.role||''}"`, `"${primary.name||''}"`, `"${primary.phone||''}"`, `"${primary.email||''}"`, `"${latestComment}"`, `"${l.source}"`, `"${l.status}"`, `"${l.value||''}"`];
        });
        const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a'); link.href = url; link.setAttribute('download', `CRM_Company_Leads.csv`);
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
        showToast('Exported leads to CSV file');
      };

      return (
        <div className="app-viewport">
          <div className="ambient-bg-layer">
            <div className="bg-grid-pattern"></div>
            <div className="ambient-orb orb-top-left"></div>
            <div className="ambient-orb orb-top-right"></div>
          </div>

          <div className="app-container">
            <header className="top-header">
              <div className="header-brand-row">
                <div className="brand-section">
                  <div className="brand-icon-wrapper">📈</div>
                  <div className="brand-titles">
                    <h1>Lead Tracker</h1>
                    <p>Manage and track your business sales leads</p>
                  </div>
                </div>
                <button className="btn-primary" onClick={() => { setEditLead(null); setIsModalOpen(true); }}>
                  + Add Lead
                </button>
              </div>

              <div className="kpi-metrics-row-5">
                <div className="kpi-card"><div className="kpi-icon-box kpi-blue">👥</div><div className="kpi-content"><span className="kpi-label">TOTAL LEADS</span><span className="kpi-value">{leads.length}</span></div></div>
                <div className="kpi-card"><div className="kpi-icon-box kpi-sky">✨</div><div className="kpi-content"><span className="kpi-label">NEW LEADS</span><span className="kpi-value">{leads.filter(l=>l.status===STAGES.NEW_LEAD).length}</span></div></div>
                <div className="kpi-card"><div className="kpi-icon-box kpi-amber">⏳</div><div className="kpi-content"><span className="kpi-label">CONTACTED</span><span className="kpi-value">{leads.filter(l=>l.status===STAGES.CONTACTED).length}</span></div></div>
                <div className="kpi-card"><div className="kpi-icon-box kpi-emerald">✅</div><div className="kpi-content"><span className="kpi-label">CONVERTED</span><span className="kpi-value">{leads.filter(l=>l.status===STAGES.CONVERTED).length}</span></div></div>
                <div className="kpi-card"><div className="kpi-icon-box kpi-green">💵</div><div className="kpi-content"><span className="kpi-label">PIPELINE VALUE</span><span className="kpi-value">{totalPipelineValue}</span></div></div>
              </div>
            </header>

            <div className="toolbar">
              <div className="toolbar-controls">
                <input className="search-input" placeholder="Search company, contact, notes..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} />
                <select className="filter-select" value={sourceFilter} onChange={e => setSourceFilter(e.target.value)}>
                  <option value="All">All Sources</option>
                  {SOURCES.map(s => <option key={s} value={s}>{s}</option>)}
                </select>
                <select className="filter-select" value={statusFilter} onChange={e => setStatusFilter(e.target.value)}>
                  <option value="All">All Statuses</option>
                  {Object.values(STAGES).map(s => <option key={s} value={s}>{s}</option>)}
                </select>
              </div>
              <div>
                <button className="btn-secondary" style={{ marginRight:'0.5rem' }} onClick={resetSeed}>Reset Sample Data</button>
                <button className="btn-secondary" onClick={exportCSV}>Export CSV</button>
              </div>
            </div>

            <main className="data-table-card">
              <div className="table-responsive-wrapper">
                <table className="crm-data-table">
                  <thead>
                    <tr>
                      <th onClick={() => handleSort('companyName')}>Company {sortField === 'companyName' ? (sortDirection === 'asc' ? '▲' : '▼') : ''}</th>
                      <th onClick={() => handleSort('role')}>Role {sortField === 'role' ? (sortDirection === 'asc' ? '▲' : '▼') : ''}</th>
                      <th onClick={() => handleSort('primaryName')}>Lead {sortField === 'primaryName' ? (sortDirection === 'asc' ? '▲' : '▼') : ''}</th>
                      <th>Contact</th>
                      <th onClick={() => handleSort('source')}>Source {sortField === 'source' ? (sortDirection === 'asc' ? '▲' : '▼') : ''}</th>
                      <th onClick={() => handleSort('status')}>Status {sortField === 'status' ? (sortDirection === 'asc' ? '▲' : '▼') : ''}</th>
                      <th>Comments & Employee Notes</th>
                      <th style={{ textAlign:'right' }} onClick={() => handleSort('value')}>Deal Value {sortField === 'value' ? (sortDirection === 'asc' ? '▲' : '▼') : ''}</th>
                      <th style={{ textAlign:'right', width:'90px' }}>Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filteredAndSorted.length > 0 ? (
                      filteredAndSorted.map(lead => {
                        const primary = lead.employees?.[0] || {};
                        const otherCount = (lead.employees?.length || 1) - 1;
                        const avatar = getAvatarColor(primary.name);
                        const comments = lead.comments || [];
                        const latestC = comments[0];

                        return (
                          <tr key={lead.id} className="table-data-row">
                            <td><span className="company-name-text">{lead.companyName}</span></td>
                            <td><span className="role-badge-text">{primary.role || 'Primary Contact'}</span></td>
                            <td>
                              <div className="lead-identity-cell">
                                <div className="lead-avatar-sm" style={{ background: avatar.bg, color: avatar.text, borderColor: avatar.border }}>
                                  {getInitials(primary.name)}
                                </div>
                                <span className="lead-name-text">{primary.name}</span>
                                {otherCount > 0 && <button className="contacts-count-pill" onClick={() => setDetailsLead(lead)}>+{otherCount}</button>}
                              </div>
                            </td>
                            <td>{primary.phone || primary.email || '—'}</td>
                            <td><span className="source-badge" data-source={lead.source}>{lead.source}</span></td>
                            <td><span className="display-status-badge" data-stage={lead.status}>{lead.status}</span></td>
                            <td>
                              {latestC ? (
                                <div className="comment-sheet-preview" onClick={() => setDetailsLead(lead)}>
                                  💬 <strong>{latestC.employeeName||primary.name}:</strong> {latestC.text.length > 20 ? latestC.text.slice(0,20) + '...' : latestC.text}
                                </div>
                              ) : (
                                <button style={{ border:'none', background:'none', color:'#64748B', cursor:'pointer', fontSize:'0.75rem' }} onClick={() => setDetailsLead(lead)}>+ Add note</button>
                              )}
                            </td>
                            <td style={{ textAlign:'right' }}><span className="deal-value-text">{lead.value || '—'}</span></td>
                            <td style={{ textAlign:'right' }}>
                              <button style={{ border:'none', background:'none', cursor:'pointer', marginRight:'0.3rem' }} onClick={() => setDetailsLead(lead)}>💬</button>
                              <button style={{ border:'none', background:'none', cursor:'pointer', marginRight:'0.3rem' }} onClick={() => { setEditLead(lead); setIsModalOpen(true); }}>✏️</button>
                              <button style={{ border:'none', background:'none', cursor:'pointer' }} onClick={() => handleDelete(lead.id)}>🗑️</button>
                            </td>
                          </tr>
                        );
                      })
                    ) : (
                      <tr><td colSpan="9" style={{ textAlign:'center', padding:'3rem' }}>No matching company records found</td></tr>
                    )}
                  </tbody>
                </table>
              </div>
              <div className="table-pagination-footer">
                <span>Showing <strong>{filteredAndSorted.length}</strong> company leads</span>
              </div>
            </main>

            {isModalOpen && <EditModal lead={editLead} onClose={() => setIsModalOpen(false)} onSave={handleSave} />}
            {detailsLead && <DetailsModal lead={leads.find(l=>l.id===detailsLead.id)||detailsLead} onClose={() => setDetailsLead(null)} onAddComment={handleAddComment} onDeleteComment={handleDeleteComment} />}
            {toast && <div className="toast-container"><div className="toast">{toast}</div></div>}
          </div>
        </div>
      );
    }

    function DetailsModal({ lead, onClose, onAddComment, onDeleteComment }) {
      const [commentText, setCommentText] = React.useState('');
      const [targetEmp, setTargetEmp] = React.useState('');
      const primary = lead.employees?.[0] || {};
      const employees = lead.employees || [];
      const others = lead.employees?.slice(1) || [];

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2>{lead.companyName}</h2>
              <button style={{ border:'none', background:'none', cursor:'pointer' }} onClick={onClose}>✕</button>
            </div>
            <div className="modal-body modal-scrollable-body">
              <div style={{ display:'flex', gap:'0.5rem', marginBottom:'0.5rem' }}>
                <span className="display-status-badge" data-stage={lead.status}>{lead.status}</span>
                <span className="source-badge" data-source={lead.source}>{lead.source}</span>
                {lead.value && <strong>{lead.value}</strong>}
              </div>

              <div className="primary-contact-box">
                <div>
                  <strong>{primary.name}</strong> ({primary.role || 'Primary'})<br/>
                  {primary.phone && <span>☎ {primary.phone} </span>}
                  {primary.email && <span>✉ {primary.email}</span>}
                </div>
              </div>

              {others.length > 0 && (
                <div>
                  <h4 style={{ margin:'0.5rem 0' }}>Other Contacts ({others.length})</h4>
                  {others.map((emp, i) => (
                    <div key={i} style={{ fontSize:'0.85rem', marginBottom:'0.25rem' }}>
                      • {emp.name} — {emp.role} {emp.phone ? `(${emp.phone})` : ''} {emp.email}
                    </div>
                  ))}
                </div>
              )}

              <div style={{ marginTop:'0.75rem' }}>
                <h4 style={{ marginBottom:'0.5rem' }}>Assign Note to Employee</h4>
                <form onSubmit={e => { e.preventDefault(); if(commentText.trim()){ onAddComment(lead.id, commentText, targetEmp || primary.name); setCommentText(''); } }}>
                  <div style={{ marginBottom:'0.35rem' }}>
                    <select className="form-select" style={{ padding:'0.35rem', fontSize:'0.8rem' }} value={targetEmp || primary.name} onChange={e => setTargetEmp(e.target.value)}>
                      {employees.map((emp, i) => (
                        <option key={i} value={emp.name}>Assign to: {emp.name} ({emp.role || 'Contact'})</option>
                      ))}
                    </select>
                  </div>
                  <textarea className="comment-textarea" placeholder="Write employee specific note..." rows="2" value={commentText} onChange={e=>setCommentText(e.target.value)} />
                  <button type="submit" className="btn-primary" style={{ marginTop:'0.35rem' }}>Add Comment</button>
                </form>

                <div className="modal-scrollable-list" style={{ marginTop:'0.75rem', maxHeight:'200px', overflowY:'auto' }}>
                  {(lead.comments||[]).map(c => (
                    <div key={c.id} className="timeline-comment-item">
                      <div style={{ display:'flex', justifyContent:'space-between', fontSize:'0.75rem', color:'#64748B' }}>
                        <span>👤 For <strong>{c.employeeName || primary.name}</strong> • {c.timestamp}</span>
                        <button style={{ border:'none', background:'none', cursor:'pointer' }} onClick={() => onDeleteComment(lead.id, c.id)}>🗑️</button>
                      </div>
                      <div style={{ fontSize:'0.85rem' }}>{c.text}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function EditModal({ lead, onClose, onSave }) {
      const [companyName, setCompanyName] = React.useState(lead ? lead.companyName : '');
      const [employees, setEmployees] = React.useState(
        lead && lead.employees ? lead.employees : [{ name: '', role: 'Sales Manager', phone: '', email: '' }]
      );
      const [source, setSource] = React.useState(lead ? lead.source : 'Website');
      const [status, setStatus] = React.useState(lead ? lead.status : STAGES.NEW_LEAD);
      const [value, setValue] = React.useState(lead ? lead.value : '');
      const [initialComment, setInitialComment] = React.useState('');
      const [commentEmployee, setCommentEmployee] = React.useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!companyName.trim() || !employees[0].name.trim()) return alert('Company Name and Primary Contact Name are required');
        const formattedValue = value ? (value.startsWith('$') ? value : `$${value}`) : '';
        onSave({ companyName: companyName.trim(), employees, source, status, value: formattedValue, initialComment, commentEmployee: commentEmployee || employees[0].name });
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2>{lead ? 'Edit Company Record' : 'Add New Company Lead'}</h2>
              <button style={{ border:'none', background:'none', cursor:'pointer' }} onClick={onClose}>✕</button>
            </div>
            <form onSubmit={handleSubmit}>
              <div className="modal-body modal-scrollable-body">
                <div className="form-group">
                  <label>Company Name *</label>
                  <input className="form-input" value={companyName} onChange={e => setCompanyName(e.target.value)} required />
                </div>

                <div>
                  <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', margin:'0.5rem 0' }}>
                    <label style={{ fontWeight:600 }}>Employees / Contacts ({employees.length})</label>
                    <button type="button" style={{ border:'none', background:'none', color:'#2563EB', cursor:'pointer' }} onClick={() => setEmployees(p => [...p, { name:'', role:'Team Member', phone:'', email:'' }])}>+ Add Employee</button>
                  </div>

                  <div className="modal-scrollable-list" style={{ maxHeight:'240px', overflowY:'auto' }}>
                    {employees.map((emp, idx) => (
                      <div key={idx} style={{ background:'#F1F5F9', padding:'0.6rem', borderRadius:'6px', marginBottom:'0.5rem' }}>
                        <div style={{ display:'flex', gap:'0.5rem', marginBottom:'0.4rem' }}>
                          <input className="form-input" placeholder="Name" value={emp.name} onChange={e => { const copy=[...employees]; copy[idx].name=e.target.value; setEmployees(copy); }} required={idx===0} />
                          <input className="form-input" placeholder="Role" value={emp.role} onChange={e => { const copy=[...employees]; copy[idx].role=e.target.value; setEmployees(copy); }} />
                        </div>
                        <div style={{ display:'flex', gap:'0.5rem' }}>
                          <input className="form-input" placeholder="Phone" value={emp.phone} onChange={e => { const copy=[...employees]; copy[idx].phone=e.target.value.replace(/\D/g,'').slice(0,11); setEmployees(copy); }} />
                          <input className="form-input" placeholder="Email" value={emp.email} onChange={e => { const copy=[...employees]; copy[idx].email=e.target.value; setEmployees(copy); }} />
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <div style={{ display:'flex', gap:'1rem' }}>
                  <div className="form-group" style={{ flex:1 }}>
                    <label>Source</label>
                    <select className="form-select" value={source} onChange={e => setSource(e.target.value)}>
                      {SOURCES.map(s => <option key={s} value={s}>{s}</option>)}
                    </select>
                  </div>
                  <div className="form-group" style={{ flex:1 }}>
                    <label>Stage Status</label>
                    <select className="form-select" value={status} onChange={e => setStatus(e.target.value)}>
                      {Object.values(STAGES).map(st => <option key={st} value={st}>{st}</option>)}
                    </select>
                  </div>
                </div>

                <div className="form-group">
                  <label>Deal Value</label>
                  <input className="form-input" placeholder="e.g. 4,500" value={value} onChange={e => setValue(e.target.value)} />
                </div>

                <div className="form-group">
                  <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                    <label>{lead ? 'Add Employee Note' : 'Initial Employee Note'}</label>
                    {employees.length > 1 && (
                      <select className="form-select" style={{ padding:'0.2rem', fontSize:'0.75rem', width:'auto' }} value={commentEmployee || employees[0]?.name} onChange={e => setCommentEmployee(e.target.value)}>
                        {employees.map((emp, i) => <option key={i} value={emp.name}>Assign to: {emp.name}</option>)}
                      </select>
                    )}
                  </div>
                  <textarea className="comment-textarea" placeholder="Log employee note..." rows="2" value={initialComment} onChange={e => setInitialComment(e.target.value)} />
                </div>
              </div>
              <div className="modal-footer">
                <button type="button" onClick={onClose} style={{ padding:'0.6rem 1rem', border:'1px solid #E2E8F0', background:'#FFF', borderRadius:'6px', cursor:'pointer' }}>Cancel</button>
                <button type="submit" className="btn-primary">Save Changes</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
